{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "entkube-telemetry.serviceAccountName" . }}
  labels:
    {{- include "entkube-telemetry.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The node never calls the Kubernetes API, so this account is deliberately bound to nothing.
automountServiceAccountToken: false
{{- end }}
