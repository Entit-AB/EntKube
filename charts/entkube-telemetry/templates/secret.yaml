{{- if not .Values.node.existingSecret }}
{{- if not .Values.node.tenantId }}{{ fail "node.tenantId is required — it is the tenant whose telemetry this deployment stores." }}{{ end }}
{{- if not .Values.node.clusterId }}{{ fail "node.clusterId is required — it is the cluster the management plane addresses this node by." }}{{ end }}
{{- if not .Values.node.ingestToken }}{{ fail "node.ingestToken is required — without it the OTLP endpoint would accept writes from any pod on the cluster network." }}{{ end }}
{{- if not .Values.node.queryToken }}{{ fail "node.queryToken is required — the management plane presents it to read telemetry." }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "entkube-telemetry.fullname" . }}-config
  labels:
    {{- include "entkube-telemetry.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Identity, not credentials — but kept here so both are mounted the same way and neither ends up
  # readable in a ConfigMap alongside the tokens.
  Node__TenantId: {{ .Values.node.tenantId | quote }}
  Node__ClusterId: {{ .Values.node.clusterId | quote }}
  Node__IngestToken: {{ .Values.node.ingestToken | quote }}
  Node__QueryToken: {{ .Values.node.queryToken | quote }}
  {{- if .Values.objectStorage.bucket }}
  Telemetry__ObjectStorage__AccessKey: {{ .Values.objectStorage.accessKey | quote }}
  Telemetry__ObjectStorage__SecretKey: {{ .Values.objectStorage.secretKey | quote }}
  {{- end }}
{{- end }}
