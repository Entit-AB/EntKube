name: Release telemetry plane

# The in-cluster telemetry image and its Helm chart, published together.
#
# Deliberately NOT on every push to main, unlike the management-plane image in deploy.yml. That image is
# deployed by tag from CI, so "newest wins" is correct for it. This one is different: the chart's version
# is *pinned* in ComponentCatalog.cs, so a release only means anything when that version changes — and
# publishing on every commit would silently replace a version operators have already installed.
#
# So a release is a tag, or a deliberate manual run.

on:
  push:
    tags:
      - 'telemetry-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (default: the chart''s own version)'
        required: false
        type: string
      dry_run:
        description: 'Build and verify without publishing'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: entit.azurecr.io

jobs:
  verify:
    name: Verify chart and catalog agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠️ MUST NAME THE SAME SDK AS global.json, which this repo now carries. This said '10.0.x',
      # which installs the newest 10.0 SDK; global.json asks for 10.0.1xx, and an SDK that is not
      # installed is a hard refusal — `dotnet test` would not run at all rather than run against the
      # wrong compiler. Floating here stopped being merely imprecise and became a break.
      #
      # SdkPinTests checks EVERY dotnet-version in every workflow against the Dockerfile's tag, this
      # one included, so it cannot drift back to a floating version quietly. docs/releasing.md has
      # the bump procedure.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.101'

      # These tests check that every catalog form field targets a real chart value, and that the pinned
      # chart version matches Chart.yaml. Both failures are silent at install time — a value quietly
      # ignored, or an install that quietly uses the previous chart — so they are worth blocking a
      # release on rather than discovering in a cluster.
      - name: Catalog/chart consistency
        run: >-
          dotnet test tests/EntKube.Web.Tests/EntKube.Web.Tests.csproj
          --filter "FullyQualifiedName~EntKubeTelemetryCatalog"
          --nologo

      - name: Lint chart
        run: |
          helm lint charts/entkube-telemetry \
            --set node.tenantId=00000000-0000-0000-0000-000000000001 \
            --set node.clusterId=00000000-0000-0000-0000-000000000002 \
            --set node.ingestToken=lint --set node.queryToken=lint

      # Rendering both roles catches template errors that lint does not — a bad reference inside a
      # conditional block only fails when that block is actually rendered — and checks that no value
      # comes out in scientific notation, which .NET's Int64 binder rejects at pod startup.
      - name: Render both roles and check values
        run: |
          rendered=$(helm template rel charts/entkube-telemetry \
            --set node.tenantId=00000000-0000-0000-0000-000000000001 \
            --set node.clusterId=00000000-0000-0000-0000-000000000002 \
            --set node.ingestToken=lint --set node.queryToken=lint \
            --set objectStorage.bucket=b --set objectStorage.accessKey=a --set objectStorage.secretKey=s \
            --set querier.enabled=true)
          if printf '%s' "$rendered" | grep -nE 'value: "[0-9.]+e\+[0-9]+"'; then
            echo "::error::A value renders in scientific notation; pipe it through | int64 in the template."
            exit 1
          fi

  publish:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # ⭐ The same check the management-plane workflow grew, for the same reason: with no
      # credentials set, `docker/login-action` fails with "Username and password required" from
      # inside a third-party action, naming neither the secret nor that a secret is the cause.
      #
      # ⚠️ Gated on dry_run exactly as the login steps below are. A dry run never authenticates,
      # so demanding credentials for one would break the only way to exercise this workflow
      # without publishing — which is the case most likely to be run by somebody who does not
      # hold the credentials at all.
      #
      # Only secret NAMES are echoed, never a value.
      - name: Check the registry credentials are set
        if: ${{ !inputs.dry_run }}
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          missing=()
          [ -n "$REGISTRY_USERNAME" ] || missing+=("REGISTRY_USERNAME")
          [ -n "$REGISTRY_PASSWORD" ] || missing+=("REGISTRY_PASSWORD")

          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "### Cannot publish: missing registry credentials"
              echo
              for m in "${missing[@]}"; do echo "- \`$m\` is not set or is empty"; done
              echo
              echo "Set them with:"
              echo '```'
              for m in "${missing[@]}"; do echo "gh secret set $m"; done
              echo '```'
              echo
              echo "Re-run with \`dry_run\` to exercise the build without publishing."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error title=Missing secrets::${missing[*]} not set — see the job summary"
            exit 1
          fi

      # Cross-building linux/arm64 on an amd64 runner needs the emulation binaries registered.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # helm push to an OCI registry authenticates separately from docker, even against the same host.
      - name: Log in to the chart registry
        if: ${{ !inputs.dry_run }}
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" \
            | helm registry login ${{ env.REGISTRY }} \
                --username "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      # One script builds, verifies and publishes every EntKube artifact, so CI and a laptop cannot drift
      # apart in how a release is made. Everything CI does here can be reproduced by running the same
      # command locally.
      - name: Build and publish
        run: |
          ARGS=()
          [[ -n "${{ inputs.version }}" ]] && ARGS+=(--version "${{ inputs.version }}")
          [[ "${{ inputs.dry_run }}" != "true" ]] && ARGS+=(--push)
          scripts/release.sh telemetry "${ARGS[@]}"

      - name: Upload chart package
        uses: actions/upload-artifact@v4
        with:
          name: entkube-telemetry-chart
          path: artifacts/telemetry/*.tgz
          if-no-files-found: error
