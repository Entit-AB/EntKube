name: Build and Publish

# The management-plane image, built for linux/amd64 AND linux/arm64, and PUSHED. It does not
# deploy: rolling the server is done by hand, deliberately, so this workflow's whole job is to put
# a correct multi-arch manifest in the registry.
#
# It used to end with an SSH step that ran `docker compose pull && up -d` on one known host. That
# is removed rather than disabled — the four secrets it needed (SERVER_HOST, SERVER_USER,
# SSH_PRIVATE_KEY, COMPOSE_DIR) are no longer referenced anywhere, so a half-configured repository
# can no longer fail after a successful push. `git log -- .github/workflows/deploy.yml` has the
# step if it is ever wanted back.
#
# To roll a server by hand, on the host:
#
#   docker compose pull && docker compose up -d --remove-orphans
#
# The tags this publishes are the short commit SHA and, on the default branch, `latest`.
#
# Both architectures, because this image is no longer pulled only by one known server: entkube-install
# and the desktop installer put it on whatever host an operator has, and arm64 servers — Graviton,
# Ampere, Hetzner ARM — are ordinary now. An amd64-only image fails their pull with
#
#   no matching manifest for linux/arm64/v8 in the manifest list entries
#
# which reads like a registry fault and is not one: it means the manifest list holds no entry for the
# puller's architecture. See docs/releasing.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: entit.azurecr.io
  IMAGE: entit.azurecr.io/entkube

jobs:
  # ⚠️ THIS JOB DOES NOT GATE THE IMAGE — and for its first six runs that sentence was used to
  # excuse it being red, which was a mistake. Nothing `needs:` it, so the image is genuinely
  # unaffected; but a failed job fails the RUN, and a red cross on main is the whole of what most
  # people ever see of CI. "It does not gate the image" is true and answers a question nobody was
  # asking. What makes the name true is `continue-on-error` on the SUITE STEP — see the comment
  # there, and note that the same keyword on the JOB does not do it, which is the mistake that
  # left main non-green for a further run.
  #
  # Until it existed, NO workflow ran the test suite. This one builds and pushes on every push to
  # main, release-telemetry.yml runs a single filtered catalog check, and that was all — so main
  # could be red in tests and `latest` was published regardless, with nothing anywhere saying so.
  #
  # That is not hypothetical. Two correct changes merged fourteen seconds apart — a unique index on
  # (SecretId, VersionNumber), and the restore renumbering that keeps old backups loadable against
  # it. Each was green on its own branch and the merge was clean, because they touch different
  # files. The merge of the two was red: a test fixture built its input by seeding duplicates
  # through EF, which the new index refuses. The image built and pushed anyway.
  #
  # It is deliberately NOT a `needs:` of the build. An image that cannot be built is an outage; a
  # test that fails is information. Withholding the image to punish a red test trades the first for
  # the second, and the stale-image incident behind the credentials check below is the argument
  # against doing that. To change it, add `needs: test` to `build` — a one-line decision, and a
  # real one, so it is left to a person rather than assumed.
  test:
    name: Tests (reporting only — does not gate the image)

    # ⚠️ PINNED, not `ubuntu-latest`. The `ubuntu-latest` label began migrating to Ubuntu 26 on
    # 2026-10-19 (actions/runner-images#14748) and the rollout is gradual, so that label can give
    # one OS on one run and another on the next — which is a confound in anything timed, and a
    # source of "it worked yesterday" that nothing in the repo would record.
    #
    # ⚠️ IT IS NOT THE CAUSE OF THIS JOB'S SLOWNESS, checked rather than assumed: all six runs
    # whose logs survive report ubuntu24/20261012.334, so every slow run so far was Ubuntu 24.
    # This is pinned to stop the migration becoming a second variable while the first is open.
    #
    # The arm64 build below was already pinned, so until now the two architectures were one
    # migration away from building on different operating systems.
    runs-on: ubuntu-24.04

    # ⚠️ THE BOUND BELONGS ON THE STEP, NOT THE JOB — and the first attempt put it on the job.
    #
    # A JOB `timeout-minutes` expiry is a CANCELLATION: the keyword's own documentation says
    # "before GitHub automatically cancels it". `continue-on-error` is documented only for a job
    # that FAILS, and the runner's ApplyContinueOnError returns immediately unless the result is
    # Failed — so a cancellation is unreachable by it. Cancelling also discards the job's log,
    # which is why three hour-long runs taught nothing at all.
    #
    # A STEP `timeout-minutes` expiry is recorded as FAILED ("The action '…' has timed out after N
    # minutes."), so `continue-on-error` genuinely applies there: the step's conclusion becomes
    # success, the JOB STAYS ALIVE, every later step runs, and the log survives. That is the whole
    # difference, and it is why this moved.
    #
    # The job bound below is deliberately ABOVE the step bound so it can never be the thing that
    # fires. If it ever does, something outside the suite is wrong — read the log rather than
    # raising the number.
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v4

      # ⚠️ THE VERSION HERE CHOOSES WHAT TO INSTALL. global.json CHOOSES WHAT RUNS.
      #
      # Naming 10.0.101 below is necessary and NOT sufficient, which is the whole history of this
      # job. setup-dotnet installs the SDK it is given into /usr/share/dotnet, next to the newer one
      # the runner image already ships; `dotnet` then picks the HIGHEST SDK in that directory. With
      # no global.json in the repo, this job compiled with 10.0.403 while the workflow said 10.0.101
      # — so #394 added the pin, reported it as the fix, and changed nothing. It failed at build on
      # every run from #389 through #394 inclusive, and never reached a test.
      #
      # global.json now pins the feature band, and SdkPinTests holds the names together: the
      # Dockerfile's `sdk:` tag is the authority, global.json must ask for it, and EVERY
      # dotnet-version in every workflow — this one and release-telemetry.yml — must install it.
      # Bump them in one commit or the suite fails. See docs/releasing.md.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.101'

      # The log must SAY which compiler it used. Both failures this job has had were invisible in
      # its own output: first it tested an artifact nobody ships, then it ignored a pin that looked
      # right in the YAML. Two lines of output make the next mismatch readable instead of inferred.
      # And the machine, because "slower than a laptop" was an inference and this makes it a
      # number. ~12 core-minutes of work taking over 55 here needs the core count on the record.
      - name: Say which SDK and which machine this is
        run: |
          echo "selected: $(dotnet --version)"
          dotnet --list-sdks
          echo "--- machine ---"
          echo "cores:  $(nproc)"
          echo "memory: $(free -h | awk '/^Mem:/ {print $2" total, "$7" available"}')"
          echo "os:     $(. /etc/os-release && echo "$PRETTY_NAME")"

      # ⚠️ --blame-hang WAS REMOVED, having been added by me to diagnose this and then having
      # plausibly made it worse. It never tripped at 5 minutes on any run, so it answered nothing;
      # it attaches a data collector that changes how VSTest hosts the tests; and when the job was
      # torn down the process tree did not die for ten minutes, which is the behaviour a collector
      # makes more likely. A diagnostic that may be part of the symptom is not a diagnostic.
      #
      # `console;verbosity=normal` replaces what it was meant to provide, and it is the one that
      # survives a bounded run: the .trx is written only at the END of a run, so a run cut short
      # leaves none — but the job is no longer cancelled, so its LOG is kept, and the log now
      # carries per-test names as they execute. That is what identifies a slow or stuck test.
      #
      # Two bounds, innermost first. `timeout --signal=INT` asks dotnet to stop and lets it flush,
      # which can still produce a .trx; the step's own bound is the backstop if it ignores that.
      # `set +e` plus the explicit exit keeps the real code visible in the summary below.
      #
      # ⚠️ 38 MINUTES WAS ABOUT TWO MINUTES SHORT, which the first bounded run finally showed —
      # it exited 124 having very nearly finished. Measured from that run's log:
      #
      #     build + startup   11.5 min   (10.8 of it compiling 14 assemblies)
      #     test phase        26.8 min   (killed here, not finished)
      #
      # and the machine it ran on: 2 cores, 7.8 GB. That is the whole explanation. The suite is
      # ~12 core-minutes of work; on 2 cores that is ~6 minutes if perfectly parallel, and this
      # runner is roughly 4-5x slower per core than a developer machine, which lands on ~28
      # minutes of tests. There is no hang and nothing pathological — the earlier suspicion of one
      # was wrong, and `--blame-hang` never tripping was the first evidence of that.
      #
      # ⚠️ A test reported as taking "3 m 18 s" is NOT a slow test. xUnit reports wall-clock, and
      # with both cores saturated a test needing 0.86 s of CPU (measured locally) can sit minutes
      # in the scheduler queue. Read long individual durations here as contention, not as a
      # culprit, or you will go hunting for a bug that is not there. I did.
      - name: Run the suite
        id: suite
        timeout-minutes: 50
        continue-on-error: true
        run: |
          set +e

          # ⚠️ A MEMORY SAMPLER, because the stall blames no test and the machine is the suspect.
          # One run streamed output steadily to its bound; the next went silent for 25 MINUTES
          # after a test that took 1m16s, on the same commit. Nothing single-test explains that.
          # This box is 2 cores and 7.8 GB, and every test class builds a fresh EF model over 165
          # entities plus an in-memory SQLite database — if that tips into swap or GC thrash,
          # everything stops at once and no individual test looks guilty. Thirty-second samples
          # either show the collapse or rule the machine out; both are worth more than another
          # round of my guessing.
          ( while true; do
              echo "[mem $(date -u +%H:%M:%S)] $(free -m | awk '/^Mem:/ {print "used="$3"M avail="$7"M"}') \
          load=$(cut -d" " -f1-3 /proc/loadavg)"
              sleep 30
            done ) &
          SAMPLER=$!

          # ⚠️ --blame-hang IS BACK, AND I REMOVED IT ONE RUN AGO. The reasoning then was that it
          # had never tripped so it answered nothing, and that its data collector might be part of
          # the undead-process-tree problem. The first half is now obsolete: a 25-minute silence is
          # exactly what it exists to name, and it was absent for the one run that showed one. The
          # second half was about teardown during a JOB cancellation, which the step-level bound
          # has since removed.
          #
          # 15 minutes, not 5. On two saturated cores a test needing under a second of CPU can wait
          # minutes to be scheduled — the earlier "3 m 18 s" test measured queueing, not work — so a
          # low threshold would fire on contention and name an innocent test. 15 is above any
          # queueing seen and far below the 48-minute bound.
          timeout --signal=INT --kill-after=60s 48m \
            dotnet test tests/EntKube.Web.Tests/EntKube.Web.Tests.csproj --nologo \
            --blame-hang --blame-hang-timeout 15min \
            --logger "trx;LogFileName=tests.trx" \
            --logger "console;verbosity=normal" \
            --results-directory "${{ runner.temp }}/testresults"
          code=$?

          kill "$SAMPLER" 2>/dev/null || true
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Keep the results, whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/testresults
          if-no-files-found: warn
          retention-days: 14

      # ⚠️ Green must not mean silent. `continue-on-error` rewrites the step's CONCLUSION but not
      # its `outcome`, so the truth is still readable — and writing it to the run summary is what
      # keeps "the run is green" from quietly meaning "nobody looked". Exit 124 is `timeout`'s own
      # code for having had to kill the command, which distinguishes "the suite failed" from "the
      # suite did not finish".
      - name: Say what the suite actually did
        if: always()
        run: |
          {
            echo "### Test suite: ${{ steps.suite.outcome }} (exit ${{ steps.suite.outputs.exit-code }})"
            if [ "${{ steps.suite.outputs.exit-code }}" = "124" ]; then
              echo
              echo "⚠️ Did not finish inside 48 minutes — bounded, not failed."
              echo "Expected ~40 min here: ~11 min build + ~28 min tests on 2 cores."
              echo "If this trips repeatedly the suite has grown past the runner, and the"
              echo "options are splitting the test project, sharding, or a bigger runner."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Each architecture builds on a runner of that architecture and pushes BY DIGEST — no tag.
  #
  # Native runners rather than QEMU: this Dockerfile installs a .NET workload and runs a full
  # publish, and emulating that for arm64 on an amd64 runner turns a few minutes into the better part
  # of an hour. arm64 hosted runners are free for public repositories, which this one is.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # Both legs run to completion even when one fails, so a failure shows whether it is one
      # architecture or the build itself.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      # ⭐ Named before anything slow runs, because the failure this replaces was unreadable.
      #
      # With no credentials set, `docker/login-action` fails with "Username and password required"
      # — three minutes into the run, from inside a third-party action, naming neither the secret
      # nor even that a secret is the problem. Every run on main failed that way for a day while
      # the stale image kept serving, and the deploy job is `skipped` rather than failed, so the
      # summary reads as though nothing tried to deploy.
      #
      # A secret is never echoed. Only its NAME is reported, and only when it is empty.
      - name: Check the credentials this workflow needs are set
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          missing=()
          [ -n "$REGISTRY_USERNAME" ] || missing+=("REGISTRY_USERNAME")
          [ -n "$REGISTRY_PASSWORD" ] || missing+=("REGISTRY_PASSWORD")

          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "### Build cannot start: missing repository secrets"
              echo
              for m in "${missing[@]}"; do echo "- \`$m\` is not set or is empty"; done
              echo
              echo "These are the registry credentials for \`${REGISTRY}\`. Set them with:"
              echo '```'
              for m in "${missing[@]}"; do echo "gh secret set $m"; done
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error title=Missing secrets::${missing[*]} not set — see the job summary"
            exit 1
          fi

      - name: Derive an artifact-safe platform name
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # push-by-digest: publish the layers and get a digest back without claiming a tag. A tag
          # can only point at one image, so two jobs pushing the same tag would race and the loser's
          # work would be silently discarded. The manifest list that gives them a shared tag is
          # assembled in `merge`, once both digests exist.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # No provenance attestation. Buildx otherwise adds a manifest entry with platform
          # "unknown/unknown", which several container runtimes report as a platform mismatch rather
          # than ignoring — the exact class of failure this change exists to remove.
          provenance: false
          # Scoped per architecture. One shared cache would have each build evicting the other's
          # layers on every run, which costs more than it saves.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      # Digests travel as artifacts rather than as job outputs. A matrix job's outputs are a single
      # shared map written by every leg, so the last leg to finish wins and blanks the other's key —
      # which would leave `merge` building a one-architecture manifest from a blank reference.
      - name: Record the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the digests into one manifest list and gives it the tags. This is what makes
  # `docker pull entkube:latest` resolve to the right architecture for whoever pulls it.
  merge:
    name: Publish the manifest list
    needs: build
    # Pinned for the same reason as the others — see the test job.
    runs-on: ubuntu-24.04
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          # SC2046 is disabled deliberately: the word splitting is the point. Both substitutions
          # expand to several separate arguments — "-t tagA -t tagB" and one image@digest per file —
          # and quoting either would pass the whole thing as a single argument instead.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
        env:
          IMAGE: ${{ env.IMAGE }}

      # The failure this guards against is remote and late: the image pulls fine on the machine that
      # built it, and then fails on someone's server with a message that names neither cause. Cheap
      # to assert here, expensive to discover in an install.
      - name: Verify both architectures are present
        run: |
          present=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
          echo "manifest carries: $present"
          for want in linux/amd64 linux/arm64; do
            case "$present" in
              *"$want"*) ;;
              *) echo "::error::the published manifest has no $want entry"; exit 1 ;;
            esac
          done
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ steps.meta.outputs.version }}

