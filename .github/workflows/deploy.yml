name: Build and Publish

# The management-plane image, built for linux/amd64 AND linux/arm64, and PUSHED. It does not
# deploy: rolling the server is done by hand, deliberately, so this workflow's whole job is to put
# a correct multi-arch manifest in the registry.
#
# It used to end with an SSH step that ran `docker compose pull && up -d` on one known host. That
# is removed rather than disabled — the four secrets it needed (SERVER_HOST, SERVER_USER,
# SSH_PRIVATE_KEY, COMPOSE_DIR) are no longer referenced anywhere, so a half-configured repository
# can no longer fail after a successful push. `git log -- .github/workflows/deploy.yml` has the
# step if it is ever wanted back.
#
# To roll a server by hand, on the host:
#
#   docker compose pull && docker compose up -d --remove-orphans
#
# The tags this publishes are the short commit SHA and, on the default branch, `latest`.
#
# Both architectures, because this image is no longer pulled only by one known server: entkube-install
# and the desktop installer put it on whatever host an operator has, and arm64 servers — Graviton,
# Ampere, Hetzner ARM — are ordinary now. An amd64-only image fails their pull with
#
#   no matching manifest for linux/arm64/v8 in the manifest list entries
#
# which reads like a registry fault and is not one: it means the manifest list holds no entry for the
# puller's architecture. See docs/releasing.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: entit.azurecr.io
  IMAGE: entit.azurecr.io/entkube

jobs:
  # ⚠️ THIS JOB DOES NOT GATE THE IMAGE. It runs beside `build`, and nothing depends on it.
  #
  # Until it existed, NO workflow ran the test suite. This one builds and pushes on every push to
  # main, release-telemetry.yml runs a single filtered catalog check, and that was all — so main
  # could be red in tests and `latest` was published regardless, with nothing anywhere saying so.
  #
  # That is not hypothetical. Two correct changes merged fourteen seconds apart — a unique index on
  # (SecretId, VersionNumber), and the restore renumbering that keeps old backups loadable against
  # it. Each was green on its own branch and the merge was clean, because they touch different
  # files. The merge of the two was red: a test fixture built its input by seeding duplicates
  # through EF, which the new index refuses. The image built and pushed anyway.
  #
  # It is deliberately NOT a `needs:` of the build. An image that cannot be built is an outage; a
  # test that fails is information. Withholding the image to punish a red test trades the first for
  # the second, and the stale-image incident behind the credentials check below is the argument
  # against doing that. To change it, add `needs: test` to `build` — a one-line decision, and a
  # real one, so it is left to a person rather than assumed.
  test:
    name: Tests (reporting only — does not gate the image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run the suite
        run: dotnet test tests/EntKube.Web.Tests/EntKube.Web.Tests.csproj --nologo

  # Each architecture builds on a runner of that architecture and pushes BY DIGEST — no tag.
  #
  # Native runners rather than QEMU: this Dockerfile installs a .NET workload and runs a full
  # publish, and emulating that for arm64 on an amd64 runner turns a few minutes into the better part
  # of an hour. arm64 hosted runners are free for public repositories, which this one is.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # Both legs run to completion even when one fails, so a failure shows whether it is one
      # architecture or the build itself.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      # ⭐ Named before anything slow runs, because the failure this replaces was unreadable.
      #
      # With no credentials set, `docker/login-action` fails with "Username and password required"
      # — three minutes into the run, from inside a third-party action, naming neither the secret
      # nor even that a secret is the problem. Every run on main failed that way for a day while
      # the stale image kept serving, and the deploy job is `skipped` rather than failed, so the
      # summary reads as though nothing tried to deploy.
      #
      # A secret is never echoed. Only its NAME is reported, and only when it is empty.
      - name: Check the credentials this workflow needs are set
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          missing=()
          [ -n "$REGISTRY_USERNAME" ] || missing+=("REGISTRY_USERNAME")
          [ -n "$REGISTRY_PASSWORD" ] || missing+=("REGISTRY_PASSWORD")

          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "### Build cannot start: missing repository secrets"
              echo
              for m in "${missing[@]}"; do echo "- \`$m\` is not set or is empty"; done
              echo
              echo "These are the registry credentials for \`${REGISTRY}\`. Set them with:"
              echo '```'
              for m in "${missing[@]}"; do echo "gh secret set $m"; done
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error title=Missing secrets::${missing[*]} not set — see the job summary"
            exit 1
          fi

      - name: Derive an artifact-safe platform name
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # push-by-digest: publish the layers and get a digest back without claiming a tag. A tag
          # can only point at one image, so two jobs pushing the same tag would race and the loser's
          # work would be silently discarded. The manifest list that gives them a shared tag is
          # assembled in `merge`, once both digests exist.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # No provenance attestation. Buildx otherwise adds a manifest entry with platform
          # "unknown/unknown", which several container runtimes report as a platform mismatch rather
          # than ignoring — the exact class of failure this change exists to remove.
          provenance: false
          # Scoped per architecture. One shared cache would have each build evicting the other's
          # layers on every run, which costs more than it saves.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      # Digests travel as artifacts rather than as job outputs. A matrix job's outputs are a single
      # shared map written by every leg, so the last leg to finish wins and blanks the other's key —
      # which would leave `merge` building a one-architecture manifest from a blank reference.
      - name: Record the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the digests into one manifest list and gives it the tags. This is what makes
  # `docker pull entkube:latest` resolve to the right architecture for whoever pulls it.
  merge:
    name: Publish the manifest list
    needs: build
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          # SC2046 is disabled deliberately: the word splitting is the point. Both substitutions
          # expand to several separate arguments — "-t tagA -t tagB" and one image@digest per file —
          # and quoting either would pass the whole thing as a single argument instead.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
        env:
          IMAGE: ${{ env.IMAGE }}

      # The failure this guards against is remote and late: the image pulls fine on the machine that
      # built it, and then fails on someone's server with a message that names neither cause. Cheap
      # to assert here, expensive to discover in an install.
      - name: Verify both architectures are present
        run: |
          present=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
          echo "manifest carries: $present"
          for want in linux/amd64 linux/arm64; do
            case "$present" in
              *"$want"*) ;;
              *) echo "::error::the published manifest has no $want entry"; exit 1 ;;
            esac
          done
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ steps.meta.outputs.version }}

